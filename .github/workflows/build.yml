name: Build survey

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Therion
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends therion

      # Twice: the plan's colour and names are scraps made from the built
      # survey (tools/plan.py), so the first build is without them.
      - name: Build PDF and 3D model
        run: |
          python3 -m tools.plan --empty
          (cd survey && therion draenen.thconfig)
          python3 -m tools.plan
          (cd survey && therion draenen.thconfig)

      # The landing page, the 3D view and the route planner, from the .3d.
      # Plain Python, no packages; the LiDAR is already in lidar/, and Chrome
      # (on the runner) takes the preview still.
      - name: Build the site
        run: |
          export CHROMIUM="$(command -v google-chrome || command -v chromium)"
          python3 -m tools.site

      - uses: actions/upload-artifact@v4
        with:
          name: draenen-survey
          path: |
            survey/draenen-plan.pdf
            survey/draenen.3d
            survey/therion.log
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Keep a rolling "latest" release on main so the outputs have stable public URLs.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          notes="Built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%d)."
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --notes "$notes"
          else
            gh release create latest --title "Latest survey" --notes "$notes"
          fi
          gh release upload latest survey/draenen-plan.pdf survey/draenen.3d --clobber

  # The site on GitHub Pages, from main (Settings > Pages > Source: GitHub Actions).
  pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
